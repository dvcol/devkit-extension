<!doctype html>
<html lang="en" data-native-transforms="">
  <head>
    <script>
      document.documentElement.dataset.firstScript = JSON.stringify({
        bootstrapReadyState: Reflect.get(globalThis, 'exampleHtmlBootstrap') ?? null,
        pageReadyState: document.readyState,
      });
      document.documentElement.dataset.firstNativeTransforms = JSON.stringify(
        document.documentElement.dataset.nativeTransforms.split(',').filter(Boolean),
      );
      document.addEventListener(
        'DOMContentLoaded',
        () => {
          document.querySelector('#script-timing').textContent =
            document.documentElement.dataset.firstScript;
          document.querySelector('#transform-order').textContent =
            document.documentElement.dataset.firstNativeTransforms;
        },
        { once: true },
      );
    </script>
    <meta charset="UTF-8" />
    <title>Devkit native Vite hosts</title>
  </head>
  <body>
    <h1>Devkit native Vite hosts</h1>
    <p>Enter the native authentication code printed by the running host when prompted.</p>
    <p id="connection" role="status">Connecting…</p>
    <output id="provider"></output>
    <div>
      <button id="mount" disabled>Mount counter</button>
      <button id="unmount" disabled>Unmount counter</button>
      <button id="read" disabled>Read counter capability</button>
      <button id="disconnect" disabled>Disconnect</button>
      <button id="reload">Reload to reconnect</button>
    </div>
    <output id="result"></output>
    <section id="counter"></section>
    <p>
      First page-script observation: <output id="script-timing">Waiting for the document</output>
    </p>
    <p>
      Native HTML transforms at the first page script:
      <output id="transform-order">Waiting for the document</output>
    </p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
