<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native remote provider example</title>
  </head>
  <body>
    <h1>Native remote provider</h1>
    <p>
      Open this URL in two tabs. A command in either tab updates both through native shared state.
    </p>
    <p id="connection" role="status">Connecting…</p>
    <button id="increase" disabled>Increase counter</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="reconnect">Reload to reconnect</button>
    <p id="command" role="status">No command sent by this tab.</p>
    <pre id="result" aria-label="Provider and current value" aria-live="polite">
Waiting for server state…</pre>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
