<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Native Port proof</title>
    <link rel="stylesheet" href="../src/panel.css" />
  </head>
  <body>
    <h1>Native Port proof</h1>
    <p id="status">Connecting</p>
    <label
      >JSON action recipients
      <select id="json-selection">
        <option value="extension">Extension</option>
        <option value="servers">Dev servers</option>
        <option value="all">All connected realms</option>
        <option value="devframe">Devframe provider only</option>
      </select>
    </label>
    <main id="renderer"></main>
    <p>JSON action results: <output id="json-result"></output></p>
    <p>Provider: <output id="provider"></output></p>
    <p>Counter service: <output id="catalog"></output></p>
    <button id="routed">Routed increase</button><button id="capability">Read capability</button>
    <button id="broadcast">Broadcast increase</button>
    <button id="disable-service">Disable service</button
    ><button id="enable-service">Enable service</button>
    <button id="identity">Caller identity</button><button id="write">Native write</button>
    <button id="rich">Rich value</button><button id="unsupported">Unsupported value</button>
    <button id="wait">Start pending action</button
    ><button id="release">Release pending action</button>
    <button id="executions">Execution counts</button><button id="disconnect">Disconnect</button>
    <button id="remote-close">Worker disconnect</button><output id="result"></output>
    <h2>Configured dev servers</h2>
    <form id="server-form">
      <label>Base URL <input id="server-url" name="baseURL" type="url" required /></label>
      <label>Provider ID <input id="server-id" name="providerId" required /></label>
      <label
        >Native auth token
        <input id="server-token" name="authToken" type="password" required autocomplete="off"
      /></label>
      <button type="submit">Connect server</button>
    </form>
    <p>
      <button id="refresh-pages">Refresh local pages</button>
      <label
        >Local page
        <select id="local-pages"></select
      ></label>
      <button id="connect-page">Connect selected page</button>
      <output id="page-result"></output>
    </p>
    <p><output id="providers"></output></p>
    <button id="servers-increase">Increase dev servers</button>
    <button id="all-increase">Increase all realms</button>
    <label>Preferred server <input id="preferred-server" /></label>
    <button id="fallback-increase">Increase with extension fallback</button>
    <output id="server-result"></output>
    <h2>Provider views</h2>
    <div id="server-views"></div>
    <h2>Optional localhost access</h2>
    <p>Allow browser operations on http://localhost/* through the native permission prompt.</p>
    <button id="permission-request">Request localhost access</button>
    <button id="permission-remove">Remove localhost access</button>
    <p>Permission: <output id="permission-status"></output></p>
    <output id="permission-result"></output>
    <script type="module" src="../src/panel.ts"></script>
  </body>
</html>
