name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - name: Build, types, strict lint, format and tests
        run: pnpm run ci
      - name: Install Chromium for the extension example
        run: pnpm --filter @devkit/example-webext exec playwright install --with-deps chromium
      - name: Run the real extension browser test
        run: pnpm --filter @devkit/example-webext test:browser
