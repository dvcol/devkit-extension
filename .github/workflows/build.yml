name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - name: Build, types, strict lint, format and tests
        run: pnpm run ci
      - name: Install Chromium for the extension example
        run: pnpm --filter @devkit/example-webext exec playwright install --with-deps chromium
      - name: Run the Chromium extension browser test
        run: pnpm --filter @devkit/example-webext test:browser
      - name: Verify opt-in Chromium counter persistence
        env:
          VITE_COUNTER_STORAGE_KEY: example.persisted-counter
        run: |
          pnpm --filter @devkit/example-webext build
          pnpm --filter @devkit/example-webext exec node tests/chromium-persistence.ts
      - name: Verify natural Chromium worker idle and explicit state recovery
        env:
          VITE_COUNTER_STORAGE_KEY: example.persisted-counter
        run: pnpm --filter @devkit/example-webext test:persistence:chromium:idle
      - name: Run native JSON actions across extension and server providers
        run: pnpm --filter @devkit/example-webext test:json-actions
      - name: Discover native provider views in the extension
        run: pnpm --filter @devkit/example-webext test:json-views
      - name: Broadcast the shared inspector across extension and native server providers
        run: pnpm --filter @devkit/example-webext exec node tests/mixed-inspector.ts
      - name: Reject untrusted extension callers and stale browser documents
        run: pnpm --filter @devkit/example-webext test:trust:chromium
      - name: Run native Vite browser actions, state and HTML timing
        run: pnpm --filter @devkit/example-vite-hosts test:browser
      - name: Run the shared inspector through both native server hosts
        run: pnpm --filter @devkit/example-vite-hosts test:inspector
      - name: Verify authored inspector error callbacks and recovery on both native hosts
        run: pnpm --filter @devkit/example-vite-hosts exec node tests/inspector-errors.ts
      - name: Run the shared inspector in the Chromium extension
        run: pnpm --filter @devkit/example-webext exec node tests/chromium-inspector.ts
      - name: Run custom and reference renderers on both native backends
        run: pnpm --filter @devkit/example-json-render test:browser
      - name: Verify native renderer source and style updates in Chromium
        run: pnpm --filter @devkit/example-json-render test:reload:chromium
      - name: Run the Chromium debugger contribution browser test
        run: pnpm --filter @devkit/example-debugger test:browser
      - name: Run authenticated native CDB browser integration
        run: pnpm --filter @devkit/example-debugger test:devframe
      - name: Run the same debugger contribution through the native DevTools backend
        run: pnpm --filter @devkit/example-debugger test:devtools
      - name: Install Firefox for the extension example
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '157.0'
      - name: Run custom and reference renderers on both native backends in Firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-json-render test:firefox
      - name: Run the shared inspector through both native server hosts in Firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-vite-hosts test:inspector:firefox
      - name: Verify authored inspector error callbacks and recovery in Firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-vite-hosts exec node tests/inspector-errors-firefox.ts
      - name: Verify native renderer source and style updates in Firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-json-render test:reload:firefox
      - name: Run the Firefox extension browser test
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-webext test:firefox
      - name: Run the shared inspector in the Firefox extension
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-webext exec node tests/firefox-inspector.ts
      - name: Verify opt-in Firefox counter persistence
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
          VITE_COUNTER_STORAGE_KEY: example.persisted-counter
        run: pnpm --filter @devkit/example-webext exec node tests/firefox-persistence.ts
      - name: Verify stable Firefox state after full browser restart
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
          VITE_COUNTER_STORAGE_KEY: example.persisted-counter
        run: pnpm --filter @devkit/example-webext test:persistence:firefox:restart
      - name: Verify natural Firefox event-page idle and explicit state recovery
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
          VITE_COUNTER_STORAGE_KEY: example.persisted-counter
        run: pnpm --filter @devkit/example-webext test:persistence:firefox:idle
      - name: Verify native reduced Firefox quota and explicit recovery
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
          VITE_COUNTER_STORAGE_KEY: example.persisted-counter
        run: pnpm --filter @devkit/example-webext exec node tests/firefox-quota.ts
      - name: Run the Firefox debugger availability test
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-debugger test:firefox
      - name: Verify native Firefox permission prompts and revocation
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-webext test:trust:firefox
      - name: Run concurrent native Chromium and Firefox development transitions
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          SE_DRIVER_VERSION: '0.37.1'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: pnpm --filter @devkit/example-webext test:dev
      - name: Verify API evidence from executed native browser scenarios
        run: pnpm run conformance:check --browser
      - name: Retain API inventory and executed test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: api-conformance
          include-hidden-files: true
          path: |
            .conformance/report.json
            packages/*/.conformance/vitest.json
            examples/*/.conformance/vitest.json
            examples/debugger/artifacts/*.json
            examples/debugger/artifacts/*.png
            examples/json-render/artifacts/*.json
            examples/json-render/artifacts/*.png
            examples/vite-hosts/artifacts/*.json
            examples/vite-hosts/artifacts/*.png
            examples/webext/artifacts/*.json
            examples/webext/artifacts/*.png
            examples/webext/artifacts/firefox/*.json
            examples/webext/artifacts/firefox/*.png
            examples/webext/artifacts/trust/*.json
            examples/webext/artifacts/inspector/*.json
            examples/webext/artifacts/persistence/*.json
            examples/webext/artifacts/persistence/*.png
            examples/webext/artifacts/*-development/*.json
            examples/webext/artifacts/*-development/*.png
